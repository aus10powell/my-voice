[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-voice"
version = "0.1.0"
description = "Local push-to-talk voice-to-text: hold a hotkey, speak, release, paste at cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "My Voice contributors" }]
keywords = ["speech-to-text", "whisper", "offline", "dictation", "hotkey"]
dependencies = [
  "faster-whisper>=1.0.0",
  "numpy>=1.24",
  "pynput>=1.7.6",
  "pyperclip>=1.8.2",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
whispercpp = ["pywhispercpp>=1.3.0"]
# NeMo/Parakeet is heavy (PyTorch + nemo-toolkit). Install deliberately:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install "nemo_toolkit[asr]"
parakeet = []

[project.scripts]
my-voice = "my_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
